server {
    listen 80;
    server_name bbp.example.gov.il;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name bbp.example.gov.il;
    ssl_certificate     /etc/ssl/certs/bbp.crt;
    ssl_certificate_key /etc/ssl/private/bbp.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:" always;
    client_max_body_size 200m;
    root /var/www/bbp;
    location /api/ { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_read_timeout 180s; }
    # LLM relay agent (the AI PC pulls model jobs and streams answers back; token checked by the relay).
    # Only /agent/* is reachable: the relay's OpenAI-compatible /v1 stays on loopback.
    location /llm-relay/agent/ {
        proxy_pass http://127.0.0.1:18112/agent/;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 8m;
    }
    location /llm-relay/ { return 404; }
    location / { try_files $uri /index.html; }
}
