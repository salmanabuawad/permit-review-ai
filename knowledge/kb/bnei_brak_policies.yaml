passages:
  - {id: P-POL26-1, source_id: BB-POL-2026-01-13, page: 2, section: "סעיף 2 — רקע",
     kind: summary, text_he: "המסמך קובע עקרונות לאישור תכניות בסמכות הוועדה המקומית לפי סעיף 62א(א) פסקאות 13 ו־16 להוספת שטחי בנייה בבניינים קיימים. אינו קריטריון לבדיקת בקשה להיתר רגילה."}
  - {id: P-POL26-2, source_id: BB-POL-2026-01-13, page: 2, section: "סעיף 3א׳–ב׳ — עקרונות",
     kind: summary, text_he: "הזכויות יוקצו רק להקמת חדרי גג מעל דירת גג קיימת או מאושרת. חדרי הגג חלק בלתי נפרד מדירת הגג, והגישה רק מתוכה, ללא גישה נפרדת מהשטחים המשותפים."}
  - {id: P-POL26-3, source_id: BB-POL-2026-01-13, page: 3, section: "סעיף 4ב׳ — מגבלת גובה",
     kind: summary, text_he: "מספר הקומות הטיפוסיות, לא כולל התוספת וקומת דירות הגג: עד 5 מעל קומת הכניסה באזורי מגורים ב׳ ו־ג׳; עד 4 באזורי מגורים א׳ ו־ב׳1."}
  - {id: P-POL26-4, source_id: BB-POL-2026-01-13, page: 3, section: "סעיף 4ג׳ — נסיגות",
     kind: quote, text_he: "חדרי הגג שיתווספו ייבנו בנסיגה של 2.5 מ' לכל הפחות מחזית שפת הגג של קומת דירות הגג, בנוסף לנסיגה הנדרשת לפי תכנית הגגות."}
  - {id: P-POL26-5, source_id: BB-POL-2026-01-13, page: 3, section: "סעיף 4ז׳ — הסכמת בעלים",
     kind: summary, text_he: "תנאי סף: אם גג דירת הגג רכוש משותף — הסכמה בכתב של 100% מבעלי הזכויות במגרש; אם הגג צמוד לדירת הגג — 75%."}
  - {id: P-POL26-6, source_id: BB-POL-2026-01-13, page: 3, section: "סעיף 4ח׳ — היטל השבחה",
     kind: summary, text_he: "ייגבה היטל השבחה כחוק; תשלומו או הבטחת תשלומו לפי הדין יהווה תנאי למתן היתר בנייה."}
  - {id: P-SG-30.5, source_id: BB-SG-2016, page: 15, section: "סעיף 30.5",
     kind: summary, text_he: "תוספות בנייה לכמה קומות יתוכננו לכל גובה הבניין (אגף) לפי תכנית בב/מק/105/אגפים, לשמירה על חזות הבניין."}
  - {id: P-SG-30.6, source_id: BB-SG-2016, page: 15, section: "סעיף 30.6",
     kind: summary, text_he: "לבקשות להיתר לתוספות יצורפו תמונות של הבניין הקיים."}
  - {id: P-SG-30.7, source_id: BB-SG-2016, page: 15, section: "סעיף 30.7",
     kind: summary, text_he: "התוספות יתוכננו ככל הניתן בחזיתות הצדדיות והאחוריות ולא בחזית הפונה לרחוב."}
  - {id: P-SG-30.8, source_id: BB-SG-2016, page: 15, section: "סעיף 30.8",
     kind: summary, text_he: "תוספת בחזית הפונה לרחוב תיעשה באגפים שלמים ובחזית אחידה לכל קומות הבניין."}
  - {id: P-SG-30.9, source_id: BB-SG-2016, page: 15, section: "סעיף 30.9",
     kind: summary, text_he: "כל בקשה לתוספת בבניין קיים תכלול תכנית כוללנית לכל הבניין המראה אפשרות לתוספות עתידיות לכל הדירות."}
  - {id: P-SG-31.2, source_id: BB-SG-2016, page: 15, section: "סעיף 31.2",
     kind: summary, text_he: "בקומה שלא בונים בה תיבנה רצפה ומעקה בנוי בגובה שלא יפחת מ־1.05 מ׳ מעל פני הרצפה."}
  - {id: P-SG-31.7, source_id: BB-SG-2016, page: 15, section: "סעיפים 31.7–31.9",
     kind: summary, text_he: "יש לסמן פתרון אצירת אשפה ובלוני גז; תוגש תכנית פיתוח (לובי, ביתן גז ואשפה, חניה, גינון); בהרחבות באגפים חלה חובת שיפוץ הלובי, חדר העגלות, הביתנים וקומת הקרקע."}
  - {id: P-SG-30.3, source_id: BB-SG-2016, page: 15, section: "סעיפים 30.2–30.4",
     kind: summary, text_he: "ההנחיות משלימות את התקנות, התכניות הסטטוטוריות והחוק; במקרה של אי־התאמה גוברות הוראות החוק, והמתכנן ידווח לוועדה על כל סתירה."}
  - {id: P-SERV-1, source_id: BB-SERV-2024-08, page: 4, section: "שימושי שירות — בנייני מגורים חדשים",
     kind: summary, text_he: "בבנייני מגורים חדשים: חדר מדרגות ומבואה קומתית לפחות 16 מ\"ר לקומה; מרפסת סוכה לפחות 5 מ\"ר; מבואת כניסה לפחות 1 מ\"ר ליחידה ולא פחות מ־18 מ\"ר. חל על בנייה חדשה בלבד."}
