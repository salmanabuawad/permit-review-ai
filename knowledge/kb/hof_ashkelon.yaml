  # ---- plan 633-0723718 — Zikim, more dwelling units in the existing residential area (in force 11.05.2021, י"פ 9602)
  # HA-35281D41D0 = approved provisions (scanned, OCR); HA-E8C67295F4 = 09.07.2019 print (text layer, same table).
  - {id: P-HA-633-1, source_id: HA-35281D41D0, page: 8, section: "סעיף 2 — מטרת התכנית ועיקרי הוראותיה",
     kind: summary, text_he: "תכנית 633-0723718 (זיקים) מוסיפה יחידות דיור באזור המגורים של הקיבוץ: הגדלת מספר יח\"ד ללא הגדלת השטחים העיקריים (62א(א)(8)), שינוי קו בניין (62א(א)(4)), שינוי הוראות בינוי (62א(א)(5)) והריסת מבנים (62א(א)(19))."}
  - {id: P-HA-633-2, source_id: HA-35281D41D0, page: 4, section: "סעיף 1.6 — יחס לתכניות קודמות",
     kind: summary, text_he: "התכנית משנה את 6/120/03/6 רק במה שפורט בה, ויתר הוראות 6/120/03/6 ממשיכות לחול; היא מחליפה את מק/6/2121; ותכנית 633-0332759 נשארת ללא שינוי."}
  - {id: P-HA-633-3, source_id: HA-E8C67295F4, page: 12, section: "סעיף 5 — טבלת זכויות והוראות בנייה, מצב מוצע",
     kind: summary, text_he: "אזור מגורים: שטחי בנייה 40% עיקרי ו־10% שירות מעל הכניסה הקובעת (סה\"כ 50%), תכסית 50%, 2 קומות מעל הכניסה הקובעת, גודל מגרש מזערי 300 מ\"ר, קווי בניין לפי התשריט. יח\"ד לתא שטח: 365 — 28, 366 — 43, 367 — 46, 368 — 102. נקרא מתדפיס 09.07.2019; בעותק המאושר הטבלה סרוקה — לאמת מול העותק המאושר."}
  - {id: P-HA-633-4, source_id: HA-35281D41D0, page: 10, section: "סעיף 4.1.2א — הוראות בינוי (1)–(2)",
     kind: summary, text_he: "הבנייה בקומה אחת או בשתי קומות; בתי מגורים חד־משפחתיים, דו־משפחתיים או רב־משפחתיים עם קיר משותף בין יחידות הדיור. הגגות שטוחים, משופעים או שילוב שלהם."}
  - {id: P-HA-633-5, source_id: HA-35281D41D0, page: 10, section: "סעיף 4.1.2א(3)–(4) — מבנים חורגים, מחסנים",
     kind: summary, text_he: "מבנים קיימים החורגים מהתכנית ממשיכים להתקיים, אך כל תוספת או בנייה חדשה לפי התכנית. מחסן צמוד לבית, או מחסן מחומרים קלים במרחק עד 3.0 מ' מקיר הבית ובתוך קווי הבניין; גובה פנימי עד 2.40 מ', שטח עד 10 מ\"ר ליח\"ד, נחשב שטח שירות."}
  - {id: P-HA-633-6, source_id: HA-35281D41D0, page: 10, section: "סעיף 4.1.2א(5) — גדרות",
     kind: summary, text_he: "אין להקים גדרות בין יחידות הדיור, למעט קיר הפרדה חיצוני בין שטחי החוץ של יחידות צמודות בבית דו־משפחתי (המשך לקיר ההפרדה, עד 5.0 מ' מקיר הבית ובגובה עד 1.80 מ' מעל הקרקע), מעקות ביטחון וקירות תומכים."}
  - {id: P-HA-633-7, source_id: HA-35281D41D0, page: 10, section: "סעיף 4.1.2א(6)–(7) — מערכות טכניות, ייצור חשמל",
     kind: summary, text_he: "מערכות טכניות חיצוניות (מיזוג, דוד שמש, קולטים — למעט קולטים על גג רעפים) יוסתרו במסתור או במעקה הגג. מותרים משטחים לייצור חשמל פרטי על הגגות ובתחומם בלבד, לפי תמ\"א 10/ד/10."}
  - {id: P-HA-633-8, source_id: HA-35281D41D0, page: 13, section: "סעיף 6.1 — תנאים למתן היתרי בנייה (א–ה)",
     kind: summary, text_he: "תנאים להיתר: תכנית בינוי ופיתוח מאושרת לתא השטח (מפלסים, שבילים, קירות, גדרות, חתכים); ברדיוס מגן של קידוח — אישור משרד הבריאות ומקורות; הבקשה כוללת את סביבת תכנית הבינוי, תכנית פיתוח ותכניות, חתכים וחזיתות 1:100; הריסת המבנים המסומנים להריסה; אישור פקע\"ר לפתרונות המיגון במגרש."}
  - {id: P-HA-633-9, source_id: HA-35281D41D0, page: 13, section: "סעיף 6.1ו–ח — פוטו־וולטאי, חיזוק מבנים, פסולת",
     kind: summary, text_he: "מתקן פוטו־וולטאי על גג לפי תמ\"א 10/ד/10 ובכפוף לבדיקת יציבות ואמצעי בטיחות. תוספת למבנה שלא נבנה לפי ת\"י 413 מותנית בחוות דעת לפי ת\"י 2413 ובחיזוק המבנה כולו (נוהל תמ\"א 38). הבקשה תכלול חישוב מוערך של פסולת בניין ועודפי עפר ואישור פינוי לאתר מוסדר."}
  - {id: P-HA-633-10, source_id: HA-35281D41D0, page: 13, section: "סעיף 6.2א — נגר עילי (תמ\"א 34/ב/4)",
     kind: summary, text_he: "התכנית באזור א' של תמ\"א 34/ב/4: יש להשאיר 15% משטח המגרש חדירי מים (מגוננים או בחומר חדיר), או פחות אם מותקנים במגרש מתקני החדרה (בורות או תעלות חלחול, קידוחי החדרה)."}
  - {id: P-HA-633-11, source_id: HA-35281D41D0, page: 14, section: "פרק 6 — ביוב, ניקוז, מים: א. ביוב",
     kind: summary, text_he: "כל המבנים יחוברו לביוב המרכזי ולמתקן הטיפול בשפכים של זיקים. ברדיוס מגן ג' — צנרת פוליאתילן רציפה. תכנית חיבור לביוב היא חלק מהבקשה להיתר ומאושרת ע\"י מהנדס הוועדה. היתרים לבתי מגורים יוצאו רק לאחר ביצוע תכנית המים והביוב באזור."}
  - {id: P-HA-633-12, source_id: HA-35281D41D0, page: 14, section: "פרק 6 — ב. אספקת מים (3)–(4): רדיוסי מגן של קידוחים",
     kind: summary, text_he: "התכנית בתחום רדיוסי המגן של קידוחי שקמה 7, 8 ו־9 (רדיוס א' 10 מ', ב' 84–90 מ', ג' 167–180 מ'). באזור א' אסורה כל בנייה פרט למבני הקידוח; באזור ב' אסורים מבני מגורים, מסחר וציבור; באזור ג' אסורים מתקן ביוב, קו ביוב ראשי והשקיה בקולחים; אין דישון ברדיוס המגן."}
  - {id: P-HA-633-13, source_id: HA-35281D41D0, page: 15, section: "פרק 6 — שמירה על עצים בוגרים",
     kind: summary, text_he: "לתכנית נספח עצים בוגרים; תשריט הנספח ופרק 6 בהוראות מחייבים. עץ לשימור ישולב בתכנון ולא ייכרת; כל עבודה במרחק פחות מ־4 מ' מגזעו — לפי מפרט שימור של מומחה ונוהל פקיד היערות."}

  # ---- committee guidelines for preparing a permit application
  - {id: P-HA-GUIDE-1, source_id: HA-ED8592A090, page: 1, section: "הנחיות לעריכת בקשה להיתר — מסמכים וחישוב שטחים",
     kind: summary, text_he: "הבקשה כוללת מפת מדידה עדכנית ללא תכנון, תכנית תיאום מערכות, תרשים סביבה 1:250 מהתב\"ע עם גוש, חלקה ורוזטות, ותכנית העמדה 1:250. חישוב השטחים במודול האוטומטי בשכבה נפרדת AREA, כולל קיים בהיתר ומוצע, מרפסות ופרגולות; שטח ממ\"ד נחשב שטח שירות עד 12.5 מ\"ר ברוטו."}
  - {id: P-HA-GUIDE-2, source_id: HA-ED8592A090, page: 1, section: "הנחיות לעריכת בקשה להיתר — פיתוח, קומות, חתכים",
     kind: summary, text_he: "תכנית פיתוח 1:100 עם מפלס 0.00, גבהים אבסולוטיים של קרקע טבעית ומתוכננת גם במגרשים הגובלים, ביוב, ניקוז, חניות (מקורות או לא, במידות התקן), מסתור כביסה, גדרות, פילר אשפה וחשמל, מים ובלוני גז. תכניות כל הקומות 1:100 עם קווי בניין ומרחקים; חתכים עד גבולות המגרש; חזיתות עם חומרי גמר; פריסת גדרות."}
  - {id: P-HA-GUIDE-3, source_id: HA-ED8592A090, page: 2, section: "הנחיות לעריכת בקשה להיתר — כללי",
     kind: summary, text_he: "מבנים קיימים יסומנו במספר ההיתר שלהם; נספח ממ\"ד 1:50 לפי אישור הג\"א; לא ניתן לאשר בנייה עתידית; עותקים צבועים לפי מקרא (אדום בלוקים, כחול בטון, ירוק גבס, חום עץ, צהוב הריסה, שחור קיים); פרט וחתך קונסטרוקטיבי לקיר חזית ולקיר תומך בגבול המגרש."}
  - {id: P-HA-GUIDE-4, source_id: HA-ED8592A090, page: 2, section: "הנחיות לעריכת בקשה להיתר — פוטו־וולטאי ופרגולות",
     kind: summary, text_he: "מערכת פוטו־וולטאית על גג: גודל ופרטים בתיאור הבקשה, בכל המבטים, בצבע אדום, חומר הגג (גג אסבסט — תיאום עם המשרד להגנת הסביבה), ממירים, פתרון הסתרה, פרט הנחת פאנל ותוואי כבל. פרגולה: חריגה עד 40% מהמרווח בין קו הבניין לגבול המגרש, לפחות 40% מרווחים ללא קירוי וחישוב שטח לפי התקנות."}
  - {id: P-HA-GUIDE-5, source_id: HA-ED8592A090, page: 3, section: "הנחיות לעריכת בקשה להיתר — מתקן הסקה וצובר גז",
     kind: summary, text_he: "מתקן הסקה ביתי: סימון רדיוס 15 מ' מהארובה בתרשים הסביבה, והארובה לפחות 2 מ' מעל מבנים סמוכים ברדיוס 15 מ'. צובר גז לפחות 5 מ' מקירות מקלט או ממ\"ד, וסימון מרחקיו ממבנים, כבישים, מדרכות וחניות."}

  # ---- committee policy: private swimming pools (approved by the sub-committee 29.11.2022)
  - {id: P-HA-POOL-1, source_id: HA-00FCBEE8E9, page: 1, section: "מדיניות בריכות שחייה — סעיפים 1–6",
     kind: summary, text_he: "בריכה פרטית אחת, לא מקורה, במגרש מגורים; ללא שימוש מסחרי או ציבורי. שפת הבריכה לפחות 1 מ' נטו מקיר, גדר או חומה. גדר קשיחה וקבועה בגובה 1.1 מ' לפחות במרחק 1 מ' לפחות משפת הבריכה, עם שער ננעל הנפתח החוצה. כיסוי צמוד למים אינו מחליף את הגדר."}
  - {id: P-HA-POOL-2, source_id: HA-00FCBEE8E9, page: 1, section: "מדיניות בריכות שחייה — סעיפים 7–11",
     kind: summary, text_he: "משטח דריכה של 1.3 מ' לפחות בין קיר הבית לגדר הבריכה כשיש פתח יציאה; חדר מכונות עד 5 מ\"ר, תת־קרקעי ובתוך קווי הבניין; חתימת יועץ אקוסטיקה ויועץ בטיחות, ותעודת גמר מותנית באישור יועץ הבטיחות; סינון, חיטוי ומונע זרימה חוזרת. לא חל על בריכת זרמים עד 6 מ\"ר."}
  - {id: P-HA-POOL-3, source_id: HA-00FCBEE8E9, page: 1, section: "מדיניות בריכות שחייה — נוהל עבודה",
     kind: summary, text_he: "שני מסלולים: 'מסלול ירוק' כשהתכנית המפורטת של היישוב מתירה בריכה באזור המגורים; 'מסלול הקלה' כשהתכנית אינה מתייחסת לבריכה — הוועדה דנה לגופו לאחר פרסום הקלה."}

  # ---- committee policy: ground-mounted PV in plot A of a farm (חלקה א' בנחלה)
  - {id: P-HA-PV-1, source_id: HA-F553A1F0D3, page: 1, section: "מדיניות פוטו־וולטאי בחלקה א' — כללי",
     kind: summary, text_he: "מתקן סולארי קרקעי בחלקה א' של נחלה (תמ\"א 10/ד/10, תמ\"א 1): עד דונם במצטבר, בחלק החקלאי, צמוד דופן למבנה מגורים או למבנה משק הצמוד לו, בלי לחסום גישה לשטח החקלאי ובלי להשאיר שטחים כלואים. אין לראות במתקן מבנה חקלאי."}
  - {id: P-HA-PV-2, source_id: HA-F553A1F0D3, page: 2, section: "מדיניות פוטו־וולטאי בחלקה א' — מרחקים, גובה, תנאי סף ובקרה",
     kind: summary, text_he: "5 מ' לפחות מכל מבנה חקלאי; גובה עד 5 מ'; גדר היקפית עד 2 מ'. תנאי סף: הסדרת כל מבני הנחלה בהיתרים והריסת מבנים שלא מומשו (ללא ערבות לדחייה), אישור חח\"י, הצהרות עורך ומהנדס, התקשרות עם חברת סולאר. בבקרת התכן: כיבוי אש ויועץ בטיחות, מהנדס חשמל (התקנה וסינוור), כתב התחייבות לפירוק, רמ\"י, אישור גבייה. אישור משרד החקלאות אינו נדרש."}

  # ---- survey map and mature trees
  - {id: P-HA-SURVEY-1, source_id: HA-16745DFD3D, page: 2, section: "הנחיות להכנת מפת מדידה — סעיפים 4.3, 5.3",
     kind: summary, text_he: "מפת המדידה עדכנית לחצי שנה לכל היותר ביום הגשת הבקשה למידע וביום הגשת הבקשה להיתר. תחום המיפוי: המגרש ורצועה של 10 מ' סביבו, והדרך הגובלת עד צירה (או עד צידה הנגדי אם היא צרה)."}
  - {id: P-HA-SURVEY-2, source_id: HA-16745DFD3D, page: 3, section: "הנחיות להכנת מפת מדידה — סעיף 5.5",
     kind: summary, text_he: "המפה כוללת את כל המבנים (מפגש עם הקרקע, מפלס כניסה וגובה גג, וסימון אסבסט), קירות וגדרות עם גבהים, דרכים, משטחים, עצים בוגרים (קוטר גזע בגובה 1.20 מ', גובה וקוטר נוף) ונקודות גובה בצפיפות של 10 לדונם לפחות."}
  - {id: P-HA-TREES-1, source_id: HA-C6819FBAA3, page: 1, section: "עצים בוגרים — הגדרה ועיתוי",
     kind: summary, text_he: "עץ בוגר: גובה 2 מ' לפחות וקוטר גזע 10 ס\"מ לפחות בגובה 130 ס\"מ; במגרש שייעודו מגורים — קוטר 20 ס\"מ לפחות. היתר הכרוך בכריתה או העתקה מותנה ברישיון פקיד היערות, ולכן מומלץ לפנות אליו כבר בשלב התכנון המוקדם."}
  - {id: P-HA-TREES-2, source_id: HA-C6819FBAA3, page: 2, section: "עצים בוגרים — דרכי הטיפול",
     kind: summary, text_he: "אין עצים — הליך רגיל. יש עצים שאינם בוגרים — הצהרת מודד. בנייה רחוקה יותר מ־4 מ' מגזע עץ בוגר — הצהרת מתכנן. כל העצים לשימור — הצהרת עורך, בעלים או יזם, בלי פקיד היערות. עד 5 עצים בוגרים — הצהרת בעלים עם טבלה ותמונות לפקיד היערות. מעל 5 — סקר עצים מלא."}

  # ---- Home Front Command: ממ"ד without a permit (temporary order, "Iron Swords")
  - {id: P-HA-HFC-1, source_id: HA-917226302E, page: 1, section: "הנחיות פקע\"ר 22.07.2025 — סעיפים 3–4א",
     kind: summary, text_he: "לפי הוראת השעה ניתן להקים בלי היתר בנייה ממ\"ד אחד לכל יחידת דיור שאין לה ממ\"ד, במבנה של עד שתי קומות מעל הקרקע, או ביחידה צמודת קרקע שאין מעליה ומתחתיה יחידה אחרת. תקנות הפטור בתוקף לשנה מפרסומן אך חלות על בקשות שהוגשו בתוקפן, ואישור פקע\"ר תקף לשנה."}
  - {id: P-HA-HFC-2, source_id: HA-917226302E, page: 2, section: "הנחיות פקע\"ר — סעיף 8, שיטת העבודה",
     kind: summary, text_he: "עורך הבקשה מכין נספח מיגון לפי התקנות ומפרטי פקע\"ר ומזין למערכת הרישוי המקוונת של פקע\"ר; פקע\"ר מאשר או דוחה תוך 14 ימים; תוך 45 ימים מסיום הביצוע העורך מדווח לרשות הרישוי ולפקע\"ר."}

  # ---- regulations file 12066 (29.09.2025): licensing amendments in force 19.11.2025
  - {id: P-HA-REG12066-1, source_id: HA-0DD86832A9, page: 2, section: "תיקון תקנות 46 ו־59 לתקנות רישוי בנייה",
     kind: summary, text_he: "תוקף החלטה לאשר בקשה להיתר הוארך משנתיים לשלוש שנים ותקנות המשנה שאפשרו להאריכו נמחקו (תקנה 46); תוקף היתר בנייה הוארך משלוש לשש שנים (תקנה 59(א))."}
  - {id: P-HA-REG12066-2, source_id: HA-0DD86832A9, page: 6, section: "תחילה והוראות מעבר",
     kind: summary, text_he: "חל על החלטות והיתרים שניתנו ביום התחילה או אחריו, ועל כאלה שביום התחילה טרם חלפו שלוש שנים מנתינתם. על היתר שעברו שלוש שנים או יותר ממועד נתינתו ממשיכה לחול תקנה 60 בנוסחה הקודם."}
