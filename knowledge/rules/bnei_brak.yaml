    spatial_scope: {plans: ["בב/105"]}
    check:
      kind: compare
      operand: facts_derived.total_main_after_m2
      operator: "<="
      threshold: null
      threshold_missing_he: "טבלת זכויות ב/105 למגרש טרם הוזנה ואומתה"
