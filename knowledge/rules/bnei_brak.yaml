    check: {kind: doc_required, doc_type: existing_building_photos, doc_label_he: "תמונות בניין קיים"}
    sources: [{source_id: BB-SG-2016, section: "פרק ה׳ סעיף 30.6", page: 15}]
    exact_clause_he: null
