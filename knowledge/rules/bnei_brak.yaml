  - id: BB-SG16-31.7-9
    version: "0.1"
    title_he: "פתרונות אשפה/גז, תכנית פיתוח ושיפוץ שטחים משותפים (לפי תחולה)"
    legal_level: SPATIAL_GUIDELINES
    report: reviewer
    severity: low
    review_state: SOURCE_VERIFIED
    permit_types: [addition_extension]
    check: {kind: qualitative}
