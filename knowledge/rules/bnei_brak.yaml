    report: reviewer
    severity: medium
    review_state: SOURCE_VERIFIED
    permit_types: [addition_extension]
    applicability:
      all: [{fact: declared.multi_floor_addition, op: true, label_he: "תוספת בכמה קומות"}]
    check: {kind: qualitative}
    sources: [{source_id: BB-SG-2016, section: "פרק ה׳ סעיף 30.5", page: 15}, {source_id: IPLAN-BB-MK-105-AGAFIM}]
