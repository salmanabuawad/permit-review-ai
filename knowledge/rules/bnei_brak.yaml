    sources: [{source_id: MAVAT-BB-105, section: "TODO — טבלת זכויות"}]

  # ---------------------------------------------------------------- Service-use guidelines Aug 2024
  - id: BB-SERV24-NEW-ONLY
    version: "0.1"
    title_he: "הנחיות שימושי שירות (אוגוסט 2024) — חלות על בנייני מגורים חדשים בלבד"
    legal_level: MUNICIPAL_POLICY
    report: reviewer
    severity: low
    review_state: SOURCE_LOCATED
    permit_types: [new_residential_building]
    check: {kind: qualitative}
    sources: [{source_id: BB-SERV-2024-08}]
    notes: "Deliberately scoped to new buildings so it is NA for additions; applying it to additions requires an applicability decision."

  - id: BB-SG16-31.2-RAILING
    version: "0.1"
    title_he: "מעקה בנוי בקומה שלא בונים בה — גובה ≥ 1.05 מ׳ מעל פני הרצפה"
    legal_level: SPATIAL_GUIDELINES
    report: reviewer
    severity: medium
    review_state: SOURCE_VERIFIED
    permit_types: [addition_extension]
    applicability:
      all: [{fact: declared.has_unbuilt_floor_in_wing, op: true, label_he: "קיימת קומה באגף שלא בונים בה"}]
    check:
      kind: compare
      operand: declared.unbuilt_floor_railing_height_m
      operand_label_he: "גובה המעקה הבנוי (מתוך החתך)"
      operator: ">="
      threshold: 1.05
      units: "מ׳"
      geometry_method_he: "נתון מהחתך/מוצהר — טרם מחולץ אוטומטית מהשרטוט"
    sources: [{source_id: BB-SG-2016, section: "פרק ה׳ סעיף 31.2", page: 15}]
    fix_hint_he: "לתכנן רצפה ומעקה בנוי בגובה 1.05 מ׳ לפחות מעל פני הרצפה."

  # ---------------------------------------------------------------- Completeness — lessons from the blind test of 202401320
  # The committee refused 202401320 (17/06/2025) for missing documents, not for design:
  # "לא ניתן לדון בבקשה עד לקבלת אישור וועדת נכים; השלמת חתימות כנדרש", and approved it unchanged
  # (26/11/2025) after an updated inspection report. These rules make those gates explicit.
    tests:
      - {facts: {case.permit_type: addition_extension, declared.has_unbuilt_floor_in_wing: true, declared.unbuilt_floor_railing_height_m: 1.05}, expect: PASS}
      - {facts: {case.permit_type: addition_extension, declared.has_unbuilt_floor_in_wing: true, declared.unbuilt_floor_railing_height_m: 0.9}, expect: FAIL}
      - {facts: {case.permit_type: addition_extension, declared.has_unbuilt_floor_in_wing: false, declared.unbuilt_floor_railing_height_m: 0.9}, expect: NA, note: "אין קומה לא בנויה באגף"}
      - {facts: {case.permit_type: addition_extension, declared.unbuilt_floor_railing_height_m: 0.9}, expect: UNCERTAIN, note: "תחולה לא ידועה"}
      - {facts: {case.permit_type: new_building, declared.unbuilt_floor_railing_height_m: 0.9}, expect: NA}

  - id: BB-COMP-DISABLED-UNIT-APPROVAL
    version: "0.1"
    title_he: "בקשה לדירת נכה — אישור ועדת נכים כתנאי לדיון"
    legal_level: COMMITTEE_DECISION
    report: completeness
    severity: high
    review_state: SOURCE_LOCATED
    stages: [permit_request]
    applicability:
      all: [{fact: facts_derived.disabled_unit_requested, op: "true", label_he: "הבקשה היא לדירת נכה (מוצהר או לפי מהות הבקשה)"}]
    check:
      kind: doc_required
      doc_type: disabled_committee_approval
      doc_label_he: "אישור ועדת נכים (זכאות לדירת נכה)"
    sources:
      - {source_id: BB-SUBC-20250219, section: "החלטה בבקשה 202401320", quote_he: "לא ניתן לדון בבקשה עד לקבלת אישור וועדת נכים"}
    fix_hint_he: "לצרף אישור ועדת נכים (זכאות) לפני העברת הבקשה לדיון."
    notes: "Derived from committee practice in a decided case; the statutory/administrative basis of the approval must be confirmed by the licensing department before PROFESSIONALLY_APPROVED."

  - id: BB-COMP-OWNER-SIGNATURES
    version: "0.1"
    title_he: "חתימות כל בעלי הזכויות לפי נסח הטאבו"
    legal_level: REGULATION
    report: completeness
    severity: high
    review_state: SOURCE_LOCATED
    stages: [permit_request]
    applicability:
      all: [{fact: facts_derived.owner_signatures_pct, op: exists, label_he: "הוזן מספר בעלי הזכויות ומספר החותמים"}]
    check:
      kind: compare
      operand: facts_derived.owner_signatures_pct
      operand_label_he: "שיעור בעלי הזכויות שחתמו (מחושב: חותמים / בעלים בנסח)"
      operator: ">="
      threshold: 100
      units: "%"
      geometry_method_he: "חישוב מנתוני הטופס: declared.owners_signed / declared.owners_total"
    sources:
      - {source_id: BB-SUBC-20250219, section: "החלטה בבקשה 202401320", quote_he: "השלמת חתימות כנדרש"}
      - {source_id: BB-SUBC-20250218, section: "הערות מח׳ רישוי, בקשה 202500019", page: 16}
      - {source_id: REG-RISHUY-2016, section: "תקנה 36 — הודעה לבעלים שלא חתמו (נוסח לא נקרא)"}
    fix_hint_he: "להשלים חתימות בעלי הזכויות, או לצרף אסמכתא למסירת הודעה לבעלים שלא חתמו לפי תקנה 36(ב)."
    notes: "Below 100% is not automatically a refusal — the regulations allow notice to non-signing owners instead; see BB-COMP-REG36-NOTICE. This rule surfaces the gap; it does not decide it."

  - id: BB-COMP-REG36-NOTICE
    version: "0.1"
    title_he: "אסמכתא להודעה לבעלים שלא חתמו (תקנה 36(ב)) או להמצאה חלופית"
    legal_level: REGULATION
    report: completeness
    severity: high
    review_state: SOURCE_LOCATED
    stages: [permit_request]
    applicability:
      all:
        - {fact: facts_derived.owner_signatures_pct, op: exists, label_he: "הוזן מספר בעלי הזכויות ומספר החותמים"}
        - {fact: facts_derived.owner_signatures_incomplete, op: "true", label_he: "חסרות חתימות של חלק מבעלי הזכויות"}
    check:
      kind: doc_required
      doc_type: reg36_notice_proof
      doc_label_he: "אסמכתא למסירת הודעה לפי תקנה 36(ב) / המצאה חלופית לפי הנחיית היועמ\"ש"
    sources:
