  # ---------------------------------------------------------------- B/105 family (statutory) — sources missing
  - id: BB-B105-BUILDING-LINES
    version: "0.1"
    title_he: "התאמה לקווי הבניין לפי תכנית בב/105 ותיקוניה"
    legal_level: STATUTORY_PLAN
    report: rights
    severity: high
    review_state: SOURCE_MISSING
    permit_types: [addition_extension, addition_balcony, addition_sukkah]
    spatial_scope: {plans: ["בב/105"]}
    check:
      kind: compare
      operand: measure.proposed_outside_building_line_m2
      operand_label_he: "שטח בנייה מוצעת מחוץ לקווי הבניין"
      operator: "<="
      threshold: 0.0
      units: "מ\"ר"
      geometry_method_he: "הפרש פוליגונים: בנייה מוצעת פחות מעטפת קווי הבניין"
    sources: [{source_id: MAVAT-BB-105, section: "TODO — הוראות קווי בניין"}]
    notes: "Building-line distances must come from the plan instructions + tasrit for the specific parcel. The envelope polygon is drawn by the applicant; verifying it against the plan is a reviewer task until GIS of B/105 is loaded."

  - id: BB-B105-MAX-HEIGHT
    version: "0.1"
    title_he: "גובה מרבי לפי תכנית בב/105 ותיקוניה"
