# Bnei Brak initial rule catalogue — PILOT DRAFT.
# NONE of these rules is PROFESSIONALLY_APPROVED. Until a licensed reviewer approves a rule
# (via the rules screen / API, recorded in rule_approvals + audit), a computed FAIL is shown
# only as a "potential non-compliance" (status UNCERTAIN). exact_clause_he is filled only
# with text read from the official source; null = not yet transcribed/verified.
jurisdiction: bnei-brak
rules:

  # ---------------------------------------------------------------- Policy 13.1.2026 (roof rooms)
  - id: BB-POL26-RR-SETBACK
    version: "0.1"
    title_he: "נסיגת חדר גג חדש מחזית שפת הגג ≥ 2.5 מ׳ (בנוסף לנסיגה בתכנית הגגות)"
    legal_level: MUNICIPAL_POLICY
    report: reviewer
    severity: high
    review_state: SOURCE_VERIFIED
    valid_from: 2026-01-13
    valid_to: null
    permit_types: [roof_room_addition]
    stages: [plan_review]
    applicability:
      all:
        - {fact: case.track, op: eq, value: policy_2026_roof_rights, label_he: "מסלול: תכנית בסמכות מקומית (62א(א)) לתוספת זכויות לפי מדיניות 13.1.2026"}
        - {fact: case.building_existing, op: true, label_he: "בניין קיים"}
    check:
      kind: compare
      operand: measure.roof_room_front_setback_m
      operand_label_he: "מרחק חדר הגג משפת הגג בחזית"
      operator: ">="
      threshold: 2.5
      units: "מ׳"
      geometry_method_he: "מרחק מינימלי (Shapely) בין פוליגון חדר הגג לקו שפת הגג בחזית, בשכבת ROOF_EDGE_FRONT"
      measuring_point_status: UNVERIFIED   # the exact measuring point must be confirmed by the reviewer
    evidence_required: [dxf:ROOF_ROOM, dxf:ROOF_EDGE_FRONT]
    sources:
      - {source_id: BB-POL-2026-01-13, section: "סעיף 4ג׳ — נסיגות", page: 3, quote_he: "בנסיגה של 2.5 מ' לכל הפחות מחזית שפת הגג של קומת דירות הגג"}
    exact_clause_he: "חדרי הגג שיתווספו ייבנו בנסיגה של 2.5 מ' לכל הפחות מחזית שפת הגג של קומת דירות הגג. נסיגה זו תהיה בנוסף לנסיגה הדרושה לדירת הגג על פי תכנית הגגות."
    related_plans: ["501-0873794"]
    fix_hint_he: "להרחיק את חדר הגג כך שהנסיגה מחזית שפת הגג תהיה 2.5 מ׳ לפחות, בנוסף לנסיגה הנדרשת בתכנית הגגות."
    notes: "Applies ONLY to plans adding rights under the 13.1.2026 policy — never as a general roof/balcony limit."

  - id: BB-POL26-FLOORS
    version: "0.1"
    title_he: "מספר קומות טיפוסיות מעל קומת הכניסה — לפי אזור מגורים (מדיניות 13.1.2026)"
    legal_level: MUNICIPAL_POLICY
    report: rights
    severity: high
    review_state: SOURCE_VERIFIED
    valid_from: 2026-01-13
    permit_types: [roof_room_addition]
    stages: [plan_review]
    applicability:
      all:
        - {fact: case.track, op: eq, value: policy_2026_roof_rights, label_he: "מסלול מדיניות 13.1.2026"}
    check:
      kind: compare
      operand: declared.typical_floors_above_entry
      operand_label_he: "קומות טיפוסיות מעל קומת הכניסה, ללא התוספת וללא קומת דירות הגג (מוצהר)"
      operator: "<="
      threshold_by:
        fact: case.zone
        label_he: "אזור מגורים"
        map: {residential_B: 5, residential_C: 5, residential_A: 4, residential_B1: 4}
      units: "קומות"
      geometry_method_he: "נתון מוצהר מהבקשה; יש לאמת מול החתכים"
    sources:
      - {source_id: BB-POL-2026-01-13, section: "סעיף 4ב׳ — מגבלת גובה", page: 3}
    exact_clause_he: "סך הקומות הטיפוסיות (בבניין לא כולל התוספת המבוקשת וקומת דירות הגג) לא יעלה על: באזורי מגורים ב' ו-ג' עד 5 קומות טיפוסיות מעל קומת הכניסה; באזורי מגורים א' ו-ב'1 עד 4."

    fix_hint_he: "לבדוק את תחולת המדיניות על הבניין; מעבר למספר הקומות המותר — המדיניות אינה חלה."
    notes: "Zone keys must be mapped from the parcel's statutory zoning (GIS/plan) — mapping still VERIFY."

  - id: BB-POL26-RR-NO-SEPARATE-ACCESS
    version: "0.1"
    title_he: "חדר הגג חלק בלתי נפרד מדירת הגג — ללא גישה נפרדת"
    legal_level: MUNICIPAL_POLICY
    report: reviewer
    severity: high
    review_state: SOURCE_VERIFIED
    valid_from: 2026-01-13
    permit_types: [roof_room_addition]
    stages: [plan_review]
    applicability:
      all: [{fact: case.track, op: eq, value: policy_2026_roof_rights, label_he: "מסלול מדיניות 13.1.2026"}]
    check:
      kind: declared_bool
      fact: declared.roof_room_separate_access
      fact_label_he: "קיימת גישה נפרדת לחדר הגג"
      expected: false
    sources: [{source_id: BB-POL-2026-01-13, section: "סעיף 3ב׳ וסעיף 4ו׳", page: 2}]
    exact_clause_he: "הגישה אליהם תתבצע אך ורק מתוך דירת הגג לה הם מתווספים, ולא תותר גישה נפרדת מהשטחים המשותפים בבניין." 
    fix_hint_he: "לבטל גישה נפרדת; הגישה לחדר הגג תהיה מתוך דירת הגג בלבד."

  - id: BB-POL26-CONSENT
    version: "0.1"
    title_he: "אישורי בעלי זכויות בכתב (100% / 75% לפי מצב ההצמדה)"
    legal_level: MUNICIPAL_POLICY
    report: completeness
    severity: high
    review_state: SOURCE_VERIFIED
    valid_from: 2026-01-13
    permit_types: [roof_room_addition]
    stages: [plan_review]
    applicability:
      all: [{fact: case.track, op: eq, value: policy_2026_roof_rights, label_he: "מסלול מדיניות 13.1.2026"}]
    check:
      kind: compare
      operand: declared.consent_pct
      operand_label_he: "שיעור הסכמות בכתב"
      operator: ">="
      threshold_by:
        fact: declared.roof_attachment_status
        label_he: "מצב הצמדת הגג"
        map: {common_property: 100, attached_to_roof_apartment: 75}
      units: "%"
    sources: [{source_id: BB-POL-2026-01-13, section: "סעיף 4ז׳ — הסכמת בעלים (תנאי סף)", page: 3}]
    exact_clause_he: "היה גג דירת הגג רכוש משותף תידרש הסכמה בכתב של 100% מבעלי הזכויות במגרש... במקרה שגג דירת הגג צמוד לדירת הגג תידרש הסכמה בכתב של 75%." 
    fix_hint_he: "לצרף הסכמות בכתב בשיעור הנדרש לפי מצב ההצמדה."

  - id: BB-POL26-BETTERMENT
    version: "0.1"
    title_he: "היטל השבחה או הבטחת תשלומו — תנאי למתן היתר"
    legal_level: MUNICIPAL_POLICY
    report: rights
    severity: medium
    review_state: SOURCE_VERIFIED
    valid_from: 2026-01-13
    permit_types: [roof_room_addition]
    stages: [plan_review]
    applicability:
      all: [{fact: case.track, op: eq, value: policy_2026_roof_rights, label_he: "מסלול מדיניות 13.1.2026"}]
    check: {kind: condition}
    condition_he: "תנאי למתן היתר: תשלום היטל השבחה או הבטחת תשלומו, במקרה המתאים. אינו נבדק בשלב זה."
    sources: [{source_id: BB-POL-2026-01-13, section: "סעיף 4ח׳ — היטל השבחה", page: 3}]

