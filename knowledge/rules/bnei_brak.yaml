      threshold_missing_he: "גובה מרבי טרם הוזן מתקנון ב/105 — נדרש מסמך מקור ואישור בודק"
      units: "מ׳"
    sources: [{source_id: MAVAT-BB-105, section: "TODO"}]

  - id: BB-B105-RIGHTS-AREA
