# Internal QA checks — consistency between the application's own documents.
# These are not legal rules; they flag a contradiction inside the submission
# (e.g. drawn area vs. declared area table). Tolerances are DESIGN_ASSUMPTION values
# to be calibrated during the POC against manual reviewer measurements.
jurisdiction: "*"
rules:
  - id: QA-AREA-CAD-VS-TABLE
    version: "0.1"
    title_he: "התאמה בין שטח הבנייה המוצעת בשרטוט לבין טבלת השטחים"
    legal_level: INTERNAL_QA
    report: rights
    severity: medium
    review_state: DESIGN_ASSUMPTION
    check:
      kind: consistency
      operand_a: measure.proposed_addition_area_m2
      operand_b: facts_derived.table_proposed_total_m2
      a_label_he: "שטח מחושב מהשרטוט"
      b_label_he: "שטח מוצהר בטבלה"
      max_rel_diff: 0.01
    applicability:
      all: [{fact: case.permit_type, op: in, value: [addition_extension], label_he: "הרחבה"}]
    sources: [{source_id: INTERNAL-QA}]
    fix_hint_he: "לתקן את טבלת השטחים או את השרטוט כך שיתאימו."

  - id: QA-CAD-LAYERS
    version: "0.1"
    title_he: "שכבות CAD נדרשות לפי מוסכמת ההגשה"
    legal_level: INTERNAL_QA
    report: completeness
    severity: medium
    review_state: DESIGN_ASSUMPTION
    check: {kind: cad_roles, roles_from: layer_convention}
    sources: [{source_id: LAYER-CONVENTION}]
    fix_hint_he: "להגיש DXF/DWG עם השכבות לפי מוסכמת ההגשה של הוועדה."

  - id: QA-REQ-APPLICATION-FORM
    version: "0.1"
    title_he: "טופס בקשה להיתר"
    legal_level: REGULATION
    report: completeness
    severity: high
    review_state: SOURCE_LOCATED
    stages: [permit_request]
    check: {kind: doc_required, doc_type: application_form, doc_label_he: "טופס בקשה להיתר"}
    sources: [{source_id: GOV-LIC-FORMS}, {source_id: REG-RISHUY-2016}]

  - id: QA-REQ-SURVEY
    version: "0.1"
    title_he: "מפת מדידה"
    legal_level: REGULATION
    report: completeness
    severity: high
    review_state: SOURCE_LOCATED
    stages: [permit_request]
    check: {kind: doc_required, doc_type: survey_map, doc_label_he: "מפת מדידה"}
    sources: [{source_id: GOV-LIC-FORMS}, {source_id: REG-RISHUY-2016}]

  - id: QA-REQ-AREA-TABLE
    version: "0.1"
    title_he: "טבלת שטחים"
    legal_level: REGULATION
    report: completeness
    severity: medium
    review_state: SOURCE_LOCATED
    stages: [permit_request]
    check: {kind: doc_required, doc_type: area_table, doc_label_he: "טבלת שטחים (Excel)"}
    sources: [{source_id: GOV-LIC-FORMS}]

  - id: QA-REQ-ARCH-PLANS
    version: "0.1"
    title_he: "תכנית הגשה (שרטוט CAD)"
    legal_level: REGULATION
    report: completeness
    severity: high
    review_state: SOURCE_LOCATED
    stages: [permit_request]
    check: {kind: doc_required, doc_type: architectural_plan, doc_label_he: "תכנית הגשה (DXF/DWG)"}
    sources: [{source_id: GOV-LIC-FORMS}]

  - id: QA-REQ-PERMIT-INFO
    version: "0.1"
    title_he: "מידע להיתר"
    legal_level: REGULATION
    report: completeness
    severity: medium
    review_state: SOURCE_LOCATED
    stages: [permit_request]
    check: {kind: doc_required, doc_type: permit_info, doc_label_he: "מידע להיתר"}
    sources: [{source_id: GOV-LIC-STEPS}]

  # ---- tender spec p.26 §7.1.2 completeness items (sources to be verified against the 2016 licensing regulations)
  - id: QA-REQ-SECTIONS
    version: "0.1"
    title_he: "חתכים"
    legal_level: REGULATION
    report: completeness
    severity: medium
    review_state: SOURCE_LOCATED
    stages: [permit_request]
    check:
      kind: any_present
      items:
        - {cad_role: SECTION, label_he: "שכבת חתך בשרטוט"}
        - {doc_type: sections_elevations, label_he: "מסמך חתכים וחזיתות"}
    sources: [{source_id: TENDER-7-26, page: 26, section: "מסמך ב׳ §7.1.2"}, {source_id: GOV-LIC-FORMS}]
    fix_hint_he: "לצרף חתכים — בשכבת SECTION בשרטוט או כמסמך נפרד."

  - id: QA-REQ-ELEVATIONS
    version: "0.1"
    title_he: "חזיתות"
    legal_level: REGULATION
    report: completeness
    severity: medium
    review_state: SOURCE_LOCATED
    stages: [permit_request]
    check:
      kind: any_present
      items:
        - {cad_role: ELEVATION, label_he: "שכבת חזית בשרטוט"}
        - {doc_type: sections_elevations, label_he: "מסמך חתכים וחזיתות"}
    sources: [{source_id: TENDER-7-26, page: 26, section: "מסמך ב׳ §7.1.2"}, {source_id: GOV-LIC-FORMS}]
    fix_hint_he: "לצרף חזיתות — בשכבת ELEVATION בשרטוט או כמסמך נפרד."

  - id: QA-SURVEY-MAP-AGE
    version: "0.1"
    title_he: "מפת מדידה בתוקף — עד 6 חודשים"
    legal_level: REGULATION
    report: completeness
    severity: high
    review_state: SOURCE_LOCATED
    stages: [permit_request]
    applicability:
      all: [{fact: docs.present.survey_map, op: "true", label_he: "הוגשה מפת מדידה"}]
    check:
      kind: declared_bool
      fact: facts_derived.survey_map_within_6_months
      fact_label_he: "תאריך מפת המדידה בתוך 6 חודשים (חודשים קלנדריים) מהמועד הקובע"
      expected: true
    sources:
      - {source_id: TENDER-7-26, page: 26, section: "מסמך ב׳ §7.1.2 — מפת מדידה בתוקף"}
      - {source_id: GOV-LIC-STEPS, section: "מידע להיתר — תנאי סף: מפת מדידה שאינה ישנה מ־6 חודשים"}
      - {source_id: HA-B5420BF1DF, page: 4, section: "נוהל עצים בוגרים — מפה מצבית עדכנית מפורטת", quote_he: "מפה מצבית עדכנית מפורטת (בתוקף חצי שנה)"}
    notes: "The 6-month limit was read on gov.il for the permit-INFORMATION stage. Its application to the permit request itself must be verified against the 2016 licensing regulations. Survey date comes from declared.survey_map_date (not yet extracted from the PDF)."
    fix_hint_he: "לצרף מפת מדידה עדכנית (עד 6 חודשים)."

  - id: QA-OWNER-SIGNATURE-PCT
    version: "0.1"
    title_he: "אחוז החתימות שנכתב בתיק תואם את מספר החותמים ומספר הבעלים"
    legal_level: INTERNAL_QA
    report: reviewer
    severity: low
    review_state: DESIGN_ASSUMPTION
    stages: [permit_request]
    applicability:
      all:
        - {fact: facts_derived.owner_signatures_pct, op: exists, label_he: "הוזן מספר חותמים ומספר בעלים"}
        - {fact: declared.owner_signatures_pct_stated, op: exists, label_he: "אחוז חתימות שנכתב בטופס/בהערות"}
    check:
      kind: consistency
      operand_a: declared.owner_signatures_pct_stated
      operand_b: facts_derived.owner_signatures_pct
      a_label_he: "אחוז שנכתב"
      b_label_he: "אחוז מחושב"
      max_rel_diff: 0.001
    sources: [{source_id: BB-SUBC-20250218, page: 16, section: "\"13 חתימות בעלים מתוך 16 שהם 81.12%\" — בפועל 81.25%"}]
    fix_hint_he: "לתקן את האחוז שנכתב לפי מספר החותמים ומספר הבעלים בנסח."

  - id: QA-PLOT-AREA-VS-CADASTRE
    version: "0.1"
    title_he: "שטח המגרש בטופס תואם את שטח החלקה הרשום (פרצלציה/הפקעה)"
    legal_level: INTERNAL_QA
    report: rights
    severity: medium
    review_state: DESIGN_ASSUMPTION
    stages: [permit_request]
    applicability:
      all:
        - {fact: declared.plot_area_m2, op: exists, label_he: "שטח מגרש בטופס הבקשה"}
        - {fact: declared.parcel_registered_area_m2, op: exists, label_he: "שטח החלקה ברשומת החלקה / בנסח"}
    check:
      kind: consistency
      operand_a: declared.plot_area_m2
      operand_b: declared.parcel_registered_area_m2
      a_label_he: "שטח מגרש בטופס"
      b_label_he: "שטח חלקה רשום"
      max_rel_diff: 0.01
    sources: [{source_id: TENDER-7-26, page: 26, section: "מסמך ב׳ §7.1.2"}]
    fix_hint_he: "לבדוק אם החלקה עברה פרצלציה או הפקעה, ועל איזה שטח יש לחשב את אחוזי הבנייה לפי התכנית החלה."
    notes: "Blind test 202401320: the form used 578 m² (parcel 56 before subdivision); the current parcel 6187/2202 is 502 m² (76 m² to a road) — 102.6% vs 118.2% of the plot. Which area governs is a reviewer decision."

  # ---- document-content checks (lessons from Beit Shemesh application 10000197313, school on plot 201).
  # Facts come from per-file text signals (rules/doc_signals.py -> rules/derived.derive_document_facts).
  # A scanned page has no text, so these checks see only text-layer PDFs; silence is not compliance.
  - id: QA-DOC-PLACEHOLDER
    version: "0.1"
    title_he: "מסמך שהוגש כ\"יישלח בהמשך\" נחשב חסר"
    legal_level: INTERNAL_QA
    report: completeness
    severity: high
    review_state: DESIGN_ASSUMPTION
    stages: [permit_request]
    applicability:
      all: [{fact: facts_derived.placeholder_docs, op: exists, label_he: "נבדקו קובצי הבקשה"}]
    check:
      kind: list_empty
      fact: facts_derived.placeholder_docs
      fact_label_he: "קבצים שהם מציין מקום"
      items_label_he: "קבצים שאינם המסמך אלא הודעה שיישלח בהמשך"
      pass_he: "לא נמצאו קבצי \"יישלח בהמשך\""
    sources:
      - {source_id: BS-GUIDE-CITIZEN, page: 3, section: "בדיקת תנאי סף — הבקשה כוללת את כל המסמכים והאישורים שנדרשו במידע להיתר"}
      - {source_id: BS-PRECOND-10000197313, section: "15 מסמכים נדרשים צורפו כקובץ 'יישלח בהמשך.pdf'"}
    fix_hint_he: "לצרף את המסמך עצמו במקום קובץ \"יישלח בהמשך\"."
    notes: "Recognised by filename or by a short text that says only 'יישלח בהמשך'. A placeholder file no longer counts as present for doc_required rules."

  - id: QA-APPROVAL-PARCEL-MISMATCH
    version: "0.1"
    title_he: "אישור או מסמך נלווה מתייחס לגוש אחר מהבקשה"
    legal_level: INTERNAL_QA
    report: completeness
    severity: high
    review_state: DESIGN_ASSUMPTION
    stages: [permit_request]
    applicability:
      all: [{fact: facts_derived.foreign_parcel_docs, op: exists, label_he: "בתיק הוזן גוש ובמסמכים נמצא מספר גוש"}]
    check:
      kind: list_empty
      fact: facts_derived.foreign_parcel_docs
      fact_label_he: "מסמכים שמספר הגוש בהם שונה מגוש הבקשה"
      items_label_he: "מסמכים עם גוש שונה מגוש הבקשה"
      pass_he: "בכל המסמכים שבהם נמצא מספר גוש — הגוש תואם לבקשה"
    sources:
      - {source_id: INTERNAL-QA}
      - {source_id: BS-PRECOND-10000197313, section: "אישור HOT ואישור בזק שצורפו כ'אישור חברת חשמל' — מגרש 207, גוש 34582 חלקה 52 (הבקשה: גוש 34581 חלקה 21)"}
    fix_hint_he: "לצרף אישור שהונפק עבור הגוש, החלקה והמגרש של הבקשה."
    notes: "Block numbers are read only in a 60-character window after the label 'גוש' (4–5 digits, years skipped). Parcel (חלקה) is not compared: its number is too short to read reliably from free text."

  - id: QA-APPROVAL-ISSUER-MISMATCH
    version: "0.1"
    title_he: "האישור שצורף אינו מהגורם הנדרש (חברת החשמל / רשות העתיקות)"
    legal_level: INTERNAL_QA
    report: completeness
    severity: high
    review_state: DESIGN_ASSUMPTION
    stages: [permit_request]
    applicability:
      all: [{fact: facts_derived.issuer_mismatch_docs, op: exists, label_he: "הוגש מסמך מסוג אישור חברת החשמל או אישור רשות העתיקות"}]
    check:
      kind: list_empty
      fact: facts_derived.issuer_mismatch_docs
      fact_label_he: "אישורים שאינם מזכירים את הגורם הנדרש"
      items_label_he: "אישורים שאינם מהגורם הנדרש"
      pass_he: "כל אישור מזכיר את הגורם שממנו הוא נדרש"
    sources:
      - {source_id: INTERNAL-QA}
      - {source_id: BS-PRECOND-10000197313, section: "תנאי 8: אישור חברת חשמל — צורפו מכתבי HOT ובזק"}
    fix_hint_he: "לצרף אישור של הגורם הנדרש עצמו (למשל חברת החשמל לחדר טרפו/מיתוג); אישור של HOT או בזק אינו מחליף אותו."

  - id: QA-IAA-DEMAND-NOT-APPROVAL
    version: "0.1"
    title_he: "מכתב רשות העתיקות הוא דרישת פיקוח/תשלום ולא אישור"
    legal_level: COMMITTEE_DECISION
    report: completeness
    severity: high
    review_state: SOURCE_LOCATED
    stages: [permit_request]
    applicability:
      all: [{fact: facts_derived.antiquities_demand_docs, op: exists, label_he: "הוגש מסמך של רשות העתיקות"}]
    check:
      kind: list_empty
      fact: facts_derived.antiquities_demand_docs
      fact_label_he: "מכתבי רשות העתיקות שהם דרישה ולא אישור"
      items_label_he: "מכתבי דרישת פיקוח/תשלום במקום אישור"
      pass_he: "מסמכי רשות העתיקות אינם דרישת פיקוח/תשלום"
    sources:
      - {source_id: BS-PRECOND-10000197313, section: "תנאי 2: \"אישור רשות העתיקות (חתימה על תוכנית) ולא דרישת תשלום\""}
      - {source_id: LAW-ANTIQUITIES-1978, section: "סעיף 29 — עבודות באתר עתיקות רק באישור מוקדם של רשות העתיקות"}
    fix_hint_he: "לצרף אישור רשות העתיקות לבקשה (חתימה על התכנית), לא מכתב דרישת פיקוח או תשלום."
    notes: "Detected by phrases such as 'דרישת פיקוח', 'הזמנת פיקוח', 'עליכם לשאת בעלות'. Whether a conditional IAA letter may satisfy the requirement is a committee decision, so the rule stays advisory until approved."

  - id: QA-LICENCE-EXPIRED
    version: "0.1"
    title_he: "רישיון עורך הבקשה/המתכנן פג לפני מועד ההגשה"
    legal_level: STATUTE
    report: completeness
    severity: medium
    review_state: SOURCE_LOCATED
    stages: [permit_request]
    applicability:
      all: [{fact: facts_derived.expired_licence_docs, op: exists, label_he: "הוגש רישיון עם תאריך 'בתוקף עד'"}]
    check:
      kind: list_empty
      fact: facts_derived.expired_licence_docs
      fact_label_he: "רישיונות שתוקפם פג לפני המועד הקובע"
      items_label_he: "רישיונות שפג תוקפם לפני ההגשה"
      pass_he: "כל הרישיונות שצורפו בתוקף במועד ההגשה, או שצורפה קבלת אגרה שנתית מאוחרת יותר"
    sources:
      - {source_id: LAW-ENG-ARCH-1958, section: "סעיף 11 — רישיון מהנדס/אדריכל; הרישיון בר תוקף לאחר תשלום האגרה"}
    fix_hint_he: "לצרף רישיון בתוקף, או קבלה על תשלום האגרה השנתית, ולאמת מול פנקס המהנדסים והאדריכלים."
    notes: "Application 10000197313: the architect's card says valid until 31/03/2021 and a 03/03/2022 annual-fee receipt was attached — a later receipt counts as renewal. Both files were scans, so this needs OCR to fire on that case."

  # ---------------------------------------------------------------- licensing route validation (2026-11-26)
  - id: QA-LICENSING-ROUTE
    version: "0.1"
    title_he: "מסלול הרישוי שנבחר תואם את הבקשה (רגיל / הקלות / סטייה ניכרת)"
    legal_level: REGULATION
    report: rights
    severity: high
    review_state: PROFESSIONALLY_APPROVED
    reviewer: approved-by-default (system owner instruction, 2026-11-26)
    licensing_stage: PRELIMINARY_ACCEPTANCE
    stages: [permit_request]
    check: {kind: qualitative}
    fix_hint_he: "להגיש את הבקשה במסלול המתאים: בקשה כוללת הקלות כשיש חריגה מהתכנית; סטייה ניכרת אינה ניתנת לאישור."
    sources:
      - {source_id: HA-02FF437A29, section: "תקנה 2 — סטייה ניכרת", quote_he: "סטיה ניכרת מתכנית, לענין סעיף 151 לחוק, היא אחת מאלה"}
    notes: "backend/app/rules/route.py; rights per plan in knowledge/rights, deviation regulations in knowledge/law. NA when no rights file exists for the case's plan."

  - id: QA-FLOOR-RIGHTS
    version: "0.1"
    title_he: "זכויות הבנייה לפי קומה ומגבלות המרתף (לא רק סה\"כ עיקרי ושירות)"
    legal_level: STATUTORY_PLAN
    report: rights
    severity: high
    review_state: PROFESSIONALLY_APPROVED
    reviewer: approved-by-default (system owner instruction, 2026-11-26)
    licensing_stage: SPATIAL_REVIEW
    stages: [permit_request]
    check: {kind: qualitative}
    fix_hint_he: "להתאים את שטחי הקומות והמרתף לתכנית, או לבקש הקלה כשהיא אפשרית."
    sources:
      - {source_id: HA-02FF437A29, section: "תקנה 2(8) — הגדרת מרתף וקומה; תקנה 2(16) — שטח שירות לשימוש עיקרי"}

