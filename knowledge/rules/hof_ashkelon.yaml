    title_he: "מחסן: חלק מהבית, או מחומר קל עד 3.0 מ׳ מקיר הבית ובתחום קווי הבניין; גובה פנימי ≤ 2.40 מ׳; ≤ 10 מ\"ר ליח\"ד (שטח שירות)"
    legal_level: STATUTORY_PLAN
    report: reviewer
    severity: medium
    review_state: PROFESSIONALLY_APPROVED
    reviewer: approved-by-default (system owner instruction, 2026-11-25)
    spatial_scope: {plans: ["633-0723718"]}
    check: {kind: qualitative}
    sources:
      - {source_id: HA-PLAN-633-0723718, section: "4.1.2 א(4)", page: 11, quote_he: "ובמרחק מירבי של 3.0 מ' בין קיר הבנין לדופן המחסן ובתחום קווי הבנין, גובה מחסן (פנימי) לא יעלה על 2.40 מ' ובשטח מרבי של 10 מ\"ר ליח\"ד"}
