# Hof Ashkelon local planning committee — rule catalogue (written 2026-11-25).
# Approved by default on the system owner's instruction (25.11.2026): every rule here is PROFESSIONALLY_APPROVED, so a
# computed FAIL is the system's answer. Each approval stays open to review by the committee's licensed reviewer;
# a rule can be revoked through the approval step (POST /api/rules/{id}/approval, decision REVOKED).
# Scope: plan 633-0723718 (Zikim, residential cells 365-368). Rights values come from the committee's planning
# information for cell 368 (HA-INFO-10000583665-2) and from the plan's rights table (scan p.13, read visually).
# Quotes are transcribed from the approved instructions (OCR, checked by eye) or from the planning information.
jurisdiction: hof-ashkelon
rules:

  # ---------------------------------------------------------------- building rights (plan 633-0723718, cell 368)
  - id: HA-633-FLOORS
    version: "0.1"
    title_he: "מספר קומות מעל הכניסה הקובעת ≤ 2"
    legal_level: STATUTORY_PLAN
    report: rights
    severity: high
    review_state: PROFESSIONALLY_APPROVED
    reviewer: approved-by-default (system owner instruction, 2026-11-25)
    spatial_scope: {plans: ["633-0723718"]}
    check:
      kind: compare
      operand: declared.floors
      operand_label_he: "מספר קומות מבוקש (טופס הבקשה)"
      operator: "<="
      threshold: 2
      units: "קומות"
    sources:
      - {source_id: HA-PLAN-633-0723718, section: "5 טבלת זכויות והוראות בניה — מצב מוצע, תא שטח 368", page: 13, quote_he: "מספר קומות מעל הכניסה הקובעת: 2"}
      - {source_id: HA-PLAN-633-0723718, section: "4.1.2 א(1) הוראות בינוי", page: 11, quote_he: "הבניה תהיה בקומה אחת או בשתי קומות"}
      - {source_id: HA-INFO-10000583665-2, section: "בינוי — מספר קומות מעל מפלס הכניסה למבנה", page: 3, quote_he: "2 קומות"}
    fix_hint_he: "לתכנן את המבנה בקומה אחת או בשתי קומות בלבד."

  - id: HA-633-HEIGHT
    version: "0.1"
    title_he: "גובה מבנה ≤ 9.0 מ׳ לגג רעפים / ≤ 8.0 מ׳ לגג שטוח (לא כולל מתקנים טכניים)"
    legal_level: STATUTORY_PLAN
    report: rights
    severity: high
    review_state: PROFESSIONALLY_APPROVED
    reviewer: approved-by-default (system owner instruction, 2026-11-25)
    spatial_scope: {plans: ["633-0723718"]}
    check:
      kind: compare
      operand: declared.building_height_m
      operand_label_he: "גובה המבנה מעל הכניסה הקובעת (±0.00) עד הנקודה הגבוהה, לא כולל מתקנים טכניים"
      operator: "<="
      threshold_by:
        fact: declared.roof_type
        label_he: "סוג הגג (רעפים/שטוח)"
        map: {tiled: 9.0, flat: 8.0}
      units: "מ׳"
    sources:
      - {source_id: HA-PLAN-633-0723718, section: "5 טבלת זכויות והוראות בניה — מצב מוצע, תא שטח 368", page: 13, quote_he: "גובה מבנה- מעל הכניסה הקובעת (מטר): (1) לגג רעפים: 9.0 מ', לגג שטוח: 8.0 מ' לא כולל מתקנים טכניים, ארובות, אנטנות וכו'"}
      - {source_id: HA-INFO-10000583665-2, section: "בינוי — גובה מבנה (מטר)", page: 3, quote_he: "לגג רעפים 9.0 מ', לגג שטוח 8.0 מ', לא כולל מתקנים טכניים"}
    fix_hint_he: "להנמיך את המבנה, או לסמן בחתך את הגובה הנמדד ואת סוג הגג."
    notes: "Measured above the determining entrance level (the plan's table header), i.e. from ±0.00 in the sections. Height and roof type are not in the Rishui Zamin form — read from the sections."

  - id: HA-633-UNITS-CELL
    version: "0.2"
    title_he: "מספר יח\"ד מצטבר בתא שטח 368 (כל הבניינים בתא) ≤ 102"
    legal_level: STATUTORY_PLAN
    report: rights
    severity: medium
    review_state: PROFESSIONALLY_APPROVED
    reviewer: approved-by-default (system owner instruction, 2026-11-25)
    spatial_scope: {plans: ["633-0723718"]}
    check:
      kind: compare
      operand: declared.cell_units_total
      operand_label_he: "סה\"כ יח\"ד בתא השטח (טבלת הריכוז בתכנית הבינוי שבבקשה)"
      operator: "<="
      threshold: 102
      units: "יח\"ד"
    sources:
      - {source_id: HA-PLAN-633-0723718, section: "5 טבלת זכויות והוראות בניה — מצב מוצע, תא שטח 368", page: 13, quote_he: "מספר יח\"ד: 102"}
      - {source_id: HA-INFO-10000583665-2, section: "צפיפות בניה — מספר יחידות דיור", page: 3, quote_he: "633-0723718 102"}
    fix_hint_he: "לעדכן את טבלת הריכוז של תא השטח כך שסך יח\"ד לא יעלה על 102."
    notes: "Cumulative over the cell; the value is the applicant's own summary table — the reviewer checks it against approved permits."

