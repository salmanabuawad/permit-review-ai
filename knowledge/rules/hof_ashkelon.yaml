      operand: declared.cell_main_pct
      operand_label_he: "סה\"כ שטח עיקרי בתא השטח, % (טבלת הריכוז בבקשה)"
      operator: "<="
      threshold: 40
      units: "%"
    sources:
      - {source_id: HA-PLAN-633-0723718, section: "5 טבלת זכויות והוראות בניה — מצב מוצע, תא שטח 368", page: 13, quote_he: "שטחי בניה (% מתא שטח) מעל הכניסה הקובעת — עיקרי: 40"}
      - {source_id: HA-INFO-10000583665-2, section: "שטחים", page: 2, quote_he: "שטח עיקרי מעל לכניסה הקובעת 40%"}
      - {source_id: HA-PLAN-633-0723718, section: "2.2 עיקרי הוראות", page: 9, quote_he: "ללא הגדלת סך כל השטחים למטרות עיקריות"}

