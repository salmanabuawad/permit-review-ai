# Hof Ashkelon regional council outline plan 234/02/6 ("תכנית מתאר למועצה אזורית חוף אשקלון"), in force 31.12.1989.
# Chapter ה (built rural zone), read from the scan (OCR checked against the page image, printed p.5): in a moshav up to
# three housing units per farm holding — two of up to 160 m² gross each and one of up to 55 m² gross. Gross areas
# (before the 1992 main/service split). Height: up to three floors. The 1972 parcellation plans of the moshavim
# (ד/820, ד/821, ד/822, 156/03/6) give no rights of their own ("בהתאם לתכנית המתאר") and point here.
# Amendments in the package (4/, 26/, 29/, 43/234/02/6) are site plans (regional centre, a residential site under
# 152/03/6, industry, a border crossing) and do not change these rights. The 2022 council-wide plan for building
# provisions in moshav residential lots (docs/12) is NOT read here.
