# /etc/nginx/sites-available/permit.kortexd.com — NOT APPLIED. Install only after approval (see deploy/README.md).
#
# Splits today's shared server block (permit.kortexd.com + permit360.kortexd.com → the application) into:
#   permit.kortexd.com     public product website (static, /he/ /ar/ /en/ /ru/), the two public API calls proxied
#                          to the application, and the AI-PC relay paths that already use this host name
#   permit360.kortexd.com  the authenticated application, unchanged
# Old application paths on permit.kortexd.com are redirected to permit360.kortexd.com.
# Certificate: the existing "permit.kortexd.com" certificate already covers both names. No DNS change.

limit_req_zone $binary_remote_addr zone=permit_public:10m rate=30r/m;

map $sent_http_content_type $permit_site_cache {
    default                 "no-cache";
    ~^text/html             "no-cache";
    ~^(image|font)/         "public, max-age=2592000";
    ~^application/xml       "public, max-age=3600";
}

# ------------------------------------------------------------------ public website
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name permit.kortexd.com;

    ssl_certificate     /etc/letsencrypt/live/permit.kortexd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/permit.kortexd.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/permit.kortexd.com/current;
    index index.html;
    charset utf-8;
    charset_types text/plain text/xml text/css application/javascript application/json image/svg+xml;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Cache-Control $permit_site_cache;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Public API used by the website (committee lookup, demo request) — the application, rate-limited here too.
    location /api/public/ {
        limit_req zone=permit_public burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8145;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # AI-PC relay and drawing-conversion agent: they connect to this host name today — keep them working.
    location /api/agent/ {
        proxy_pass http://127.0.0.1:8145;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 100m;
    }
    location /llm-relay/agent/ {
        proxy_pass http://127.0.0.1:18112/agent/;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 8m;
    }
    location /llm-relay/ { return 404; }
    location = /health { proxy_pass http://127.0.0.1:8145/api/health; }

    # Everything else under /api/ and the application's routes belong to the application now.
    location /api/ { return 308 https://permit360.kortexd.com$request_uri; }
    location ~ ^/(login|apply|cases|projects|architect|rules|sources|committees|knowledge|users|audit|tasks|authorities|learning|ai|integrations)(/|$) {
        return 301 https://permit360.kortexd.com$request_uri;
    }
    location = /about.html { return 301 https://permit.kortexd.com/he/; }

    location /assets/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        error_page 404 /404.html;
        try_files $uri $uri/index.html =404;
    }
}

# ------------------------------------------------------------------ application (unchanged, own block)
server {
    listen 443 ssl;
    server_name permit360.kortexd.com;
    ssl_certificate /etc/letsencrypt/live/permit.kortexd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/permit.kortexd.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    root /opt/permit-review-ai/app/frontend/dist;
    index index.html;
    client_max_body_size 50M;
    charset utf-8;
    charset_types text/plain text/xml text/css application/javascript application/json;
    location /api/ {
        proxy_pass http://127.0.0.1:8145;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /api/agent/ {
        proxy_pass http://127.0.0.1:8145;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 100m;
    }
    location /llm-relay/agent/ {
        proxy_pass http://127.0.0.1:18112/agent/;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 8m;
    }
    location /llm-relay/ { return 404; }
    location = /health { proxy_pass http://127.0.0.1:8145/api/health; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}

server {
    listen 80;
    server_name permit.kortexd.com permit360.kortexd.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
