# /etc/nginx/sites-enabled/permit.kortexd.com — the application AND the public website on one host.
#
#   https://permit360.kortexd.com/he/ /ar/ /en/ /ru/   public website (static, /var/www/permit360.kortexd.com/current)
#   https://permit360.kortexd.com/site/                website files (CSS, JS, fonts, share images, 404)
#   /sitemap.xml /robots.txt /llms.txt                 the website's
#   /                                                  signed out (no session cookie) → the website in the visitor's
#                                                      language; signed in → the application
#   everything else                                    the application, unchanged
# permit.kortexd.com keeps serving exactly what it served before (the AI-PC relay connects to it); website pages
# requested there are redirected to permit360.kortexd.com. Certificate and DNS unchanged.

limit_req_zone $binary_remote_addr zone=permit_public:10m rate=30r/m;

map $http_accept_language $p360_site_lang {
    default  he;
    ~*^ar    ar;
    ~*^en    en;
    ~*^ru    ru;
    ~*^he    he;
}

server {
    server_name permit.kortexd.com permit360.kortexd.com;
    location /.well-known/acme-challenge/ { auth_basic off; root /var/www/certbot; }
    root /opt/permit-review-ai/app/frontend/dist;
    index index.html;
    client_max_body_size 50M;
    charset utf-8;
    charset_types text/plain text/xml text/css application/javascript application/json image/svg+xml;

    # ---------------------------------------------------------------- public website
    location = / {
        if ($cookie_bbp_session = "") { return 302 /$p360_site_lang/; }
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location ~ ^/(he|ar|en|ru)(/.*)?$ {
        if ($host != "permit360.kortexd.com") { return 301 https://permit360.kortexd.com$request_uri; }
        root /var/www/permit360.kortexd.com/current;
        try_files $uri $uri/index.html =404;
        error_page 404 /site/404.html;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
    location /site/ {
        root /var/www/permit360.kortexd.com/current;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
    location ~ ^/(sitemap\.xml|robots\.txt|llms\.txt)$ {
        root /var/www/permit360.kortexd.com/current;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /about.html { return 301 /he/; }
    location /api/public/ {
        limit_req zone=permit_public burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8145;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---------------------------------------------------------------- application (as before)
    location /api/ {
        proxy_pass http://127.0.0.1:8145;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    # LLM relay agent (the AI PC pulls model jobs and streams answers back). Token checked by the relay,
    # so no basic auth here. Only /agent/* is reachable: the relay /v1 stays on loopback.
    # DWFX conversion on the AI PC: the agent authenticates with the relay token in the app, not basic auth
    location /api/agent/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8145;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 100m;
    }
    location /llm-relay/agent/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:18112/agent/;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 8m;
    }
    location /llm-relay/ { return 404; }
    location = /health { auth_basic off; proxy_pass http://127.0.0.1:8145/api/health; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/permit.kortexd.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/permit.kortexd.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host ~ ^(permit|permit360)\.kortexd\.com$) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name permit.kortexd.com permit360.kortexd.com;
    return 404; # managed by Certbot


}
